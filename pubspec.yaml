name: rovlo
description: Rovlo — a beautifully animated travel companion app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Backend (Supabase: auth, database, storage, realtime, edge functions)
  supabase_flutter: ^2.8.4

  # Maps (OpenStreetMap-based, no API key required) & Location
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Persistence
  shared_preferences: ^2.2.3

  # UI / animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  video_player: ^2.9.1
  pin_code_fields: ^8.0.1

  # Auth & Messaging
  google_sign_in: ^6.2.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  http: ^1.2.1

  # Chat: end-to-end encryption (X25519 + AES-256-GCM), key storage, dictation
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  speech_to_text: ^7.0.0

  # Face photo for profile verification (in-app front camera)
  camera: ^0.11.0

  # SOS: loud siren, keep screen on, share the location message
  audioplayers: ^6.1.0
  wakelock_plus: ^1.2.8
  share_plus: ^10.1.0

  # Image Picking / Networking / Links
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/images/
    - assets/config/
    - assets/audio/
