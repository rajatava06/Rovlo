name: rovlo
description: Rovlo — a beautifully animated travel companion app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.2.3

  # UI / animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  video_player: ^2.9.1
  pin_code_fields: ^8.0.1

  # Utils
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/images/
